[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm"
version = "0.1.0"
authors = [{ name = "jiamumuzhao" }]
license = "MIT"
readme = "README.md"
description = "a lightweight vLLM implementation built from scratch"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "triton>=3.0.0",
    "transformers>=4.51.0",
    "numpy",
    "safetensors",
    "tqdm",
    "xxhash",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]

[project.urls]
Homepage="https://github.com/jiamumuzhao/nano-vllm"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA-capable PyTorch installation",
    "e2e: engine-level end-to-end regression test",
    "integration: requires an explicitly provisioned local integration environment",
]
